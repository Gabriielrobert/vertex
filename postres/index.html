<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Página</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  font-family:Arial, sans-serif;

  /* Espaço para o botão fixo não cobrir o conteúdo */
  padding-bottom:90px;
}


/* =========================
   AVISO NO TOPO
========================= */

.aviso-topo{
  width:100%;
  background:#fff3cd;
  color:#664d03;

  border-bottom:2px solid #ffc107;

  padding:15px 20px;

  text-align:center;

  font-size:15px;
  font-weight:600;
  line-height:1.5;
}

.aviso-topo strong{
  font-weight:800;
}


/* =========================
   IMAGENS DA PÁGINA
========================= */

.section{
  position:relative;
  width:100%;
}

.section img{
  width:100%;
  height:auto;
  display:block;
}


/* =========================
   BOTÃO FIXO NO RODAPÉ
========================= */

.rodape-fixo{
  position:fixed;

  bottom:0;
  left:0;

  width:100%;

  padding:12px 16px;

  background:rgba(0,0,0,0.92);

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;
}

.botao-download{
  width:100%;
  max-width:600px;

  display:block;

  background:#22c55e;
  color:#ffffff;

  text-align:center;
  text-decoration:none;

  font-size:18px;
  font-weight:bold;

  padding:17px 25px;

  border-radius:12px;

  box-shadow:0 4px 15px rgba(0,0,0,0.35);

  transition:0.2s;
}

.botao-download:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

.botao-download:active{
  transform:scale(0.98);
}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

  body{
    padding-bottom:85px;
  }

  .aviso-topo{
    font-size:14px;
    padding:12px 15px;
  }

  .rodape-fixo{
    padding:10px 12px;
  }

  .botao-download{
    font-size:16px;
    padding:16px 20px;
    border-radius:10px;
  }

}

</style>
</head>


<body>


<!-- AVISO NO TOPO -->

<div class="aviso-topo">
  ⚠️ <strong>Aviso importante:</strong>
  Este material foi liberado antecipadamente com base na sua confirmação de contribuição.
  Caso ainda não tenha contribuído, pedimos que regularize sua contribuição.
</div>


<!-- IMAGENS -->

<section class="section">
  <img src="https://i.ibb.co/t5pbqNY/Banner.png" alt="">
</section>

<section class="section">
  <img src="https://i.ibb.co/t5pbqNY/Banner.png" alt="">
</section>


<!-- BOTÃO FIXO NO RODAPÉ -->

<div class="rodape-fixo">

  <a
    href="SEU_LINK_AQUI"
    class="botao-download"
    target="_blank"
    rel="noopener noreferrer"
  >
    Baixar o material completo
  </a>

</div>


</body>
</html>
